openapi: "3.1.0"
info:
  title: "CV tuning session"
  version: "2.0.0"
  description: "The document a CV travels in when it leaves the portfolio admin to be retuned against a job ad, and comes back in. The root is CvExport. Generated by `php artisan cv:schema` — edit App\\Services\\CvSchema, not this file."
components:
  schemas:
    CvExport:
      type: "object"
      description: "A CV and, optionally, the job it is being tuned for. Return both halves together: the CV to be imported, and the job application recording where it was sent. Omit job_application only when no particular job is in play — a general polish rather than an application."
      required:
        - "cv"
      properties:
        cv:
          $ref: "#/components/schemas/Cv"
          description: "The retuned CV."
        job_application:
          $ref: "#/components/schemas/JobApplication"
          description: "The job this CV was tuned for, as far as the ad actually says."
    Cv:
      type: "object"
      description: "One CV, complete. Return the whole document, not a fragment. Fields marked readOnly must come back exactly as they were sent. Everything else may be rewritten, reordered or dropped to suit the target job ad — but only ever from what is already here: never invent an employer, a qualification, a project or a skill. The result is printed to a single A4 page, so length is a real constraint and the character limits are ceilings, not targets."
      required:
        - "id"
      properties:
        id:
          type: "integer"
          readOnly: true
          description: "The CV this document was exported from. Copy it back unchanged; the import refuses a document that does not belong to the CV being edited."
        locale:
          type: "string"
          enum:
            - "hu"
            - "en"
          readOnly: true
          description: "The language the CV is written in. Write in this language; do not translate the CV into another."
        full_name:
          type: "string"
          maxLength: 500
          readOnly: true
          description: "The person this CV is for. Fixed; copy back unchanged."
        avatar_path:
          type: "string"
          maxLength: 500
          readOnly: true
          description: "Stored path of the portrait printed on the CV. Fixed; copy back unchanged."
        email:
          type: "string"
          format: "email"
          maxLength: 500
          readOnly: true
          description: "Contact email. Fixed; copy back unchanged."
        phone:
          type: "string"
          maxLength: 500
          readOnly: true
          description: "Contact phone number. Fixed; copy back unchanged."
        location:
          type: "string"
          maxLength: 500
          readOnly: true
          description: "Where the person is based. Fixed; copy back unchanged."
        linkedin_url:
          type: "string"
          format: "uri"
          maxLength: 500
          readOnly: true
          description: "LinkedIn profile. Fixed; copy back unchanged."
        github_url:
          type: "string"
          format: "uri"
          maxLength: 500
          readOnly: true
          description: "GitHub profile. Fixed; copy back unchanged."
        portfolio_url:
          type: "string"
          format: "uri"
          maxLength: 500
          readOnly: true
          description: "Portfolio address, printed as a QR code. Fixed; copy back unchanged."
        languages:
          type: "array"
          readOnly: true
          items:
            $ref: "#/components/schemas/Language"
          description: "Spoken languages. Fixed; copy back unchanged."
        label:
          type: "string"
          maxLength: 500
          description: "A short internal name for this version of the CV, never printed. Name it after the job ad, e.g. \"Acme — Senior Backend\"."
        role:
          type: "string"
          maxLength: 500
          description: "The job title printed under the name. Match the wording the job ad uses where that is an honest description of the same work."
        summary:
          type: "string"
          maxLength: 500
          contentMediaType: "text/html"
          description: "Profile summary, rendered as rich text. Inline HTML only, and only these tags: <p>, <strong>, <em>, <a>. Anything else is stripped by the editor. The limit counts the markup as well as the words. Two lines at most, present tense, specific rather than aspirational."
        stack_highlights:
          type: "array"
          items:
            type: "string"
            maxLength: 500
          description: "The chip row printed above Experience. Five or six technologies, chosen and ordered for the target job ad. Draw only on technologies that appear elsewhere in this document."
        skills:
          type: "object"
          description: "Skills, grouped as they are printed. Within each group, order by relevance to the target job ad and drop what does not earn its space. Never add a skill that was not already somewhere in this document."
          properties:
            Backend:
              type: "array"
              items:
                type: "string"
                maxLength: 500
            Frontend:
              type: "array"
              items:
                type: "string"
                maxLength: 500
            Tools:
              type: "array"
              items:
                type: "string"
                maxLength: 500
            Other:
              type: "array"
              items:
                type: "string"
                maxLength: 500
        experience:
          type: "array"
          items:
            $ref: "#/components/schemas/WorkExperience"
          description: "Employment history, most recent first. Reorder or omit entries to suit the target role; never add one."
        projects:
          type: "array"
          items:
            $ref: "#/components/schemas/Project"
          description: "Projects worth printing. Select and order them for the target role; never invent or rename one."
        education:
          type: "array"
          items:
            $ref: "#/components/schemas/Education"
          description: "Qualifications. Facts: reorder or omit, but never reword or add."
    JobApplication:
      type: "object"
      description: "One job applied for. Fill in only what the ad actually states; leave anything it does not say as null rather than inferring it. Unlike the CV, this half may quote the ad freely — it is a record of what was asked for, not a claim about the applicant."
      required:
        - "company"
      properties:
        id:
          type: "integer"
          readOnly: true
          description: "Present only when this CV already has an application recorded. Copy it back unchanged and the existing record is updated; leave it out and a new one is created."
        company:
          type: "string"
          maxLength: 255
          description: "Who the application went to. The one field that must be filled in; ask if the ad does not name them."
        title:
          type: "string"
          maxLength: 255
          description: "The advertised job title, exactly as the ad writes it."
        method:
          type: "string"
          enum:
            - "linkedin"
            - "profession_hu"
            - "email"
            - "company_site"
            - "ats"
            - "other"
          description: "Where the application was submitted. Ask if it is not obvious; use \"ats\" for an HR system that is not listed and name it in method_detail."
        method_detail:
          type: "string"
          maxLength: 255
          description: "Which system, when method is \"ats\" or \"other\" — e.g. \"Greenhouse\", \"Teamtailor\"."
        source_url:
          type: "string"
          format: "uri"
          maxLength: 1024
          description: "Link to the posting, if there is one."
        location:
          type: "string"
          maxLength: 255
          description: "Where the job is, as the ad puts it — including \"Remote\" or \"Hybrid, Budapest\"."
        experience_level:
          type: "string"
          enum:
            - "junior"
            - "medior"
            - "senior"
            - "lead"
          description: "The seniority the ad asks for. Null unless the ad names one; do not infer it from the required years."
        required_years:
          type: "integer"
          minimum: 0
          maximum: 50
          description: "Overall years of experience asked for. Null unless the ad gives a figure; for a range, take the lower bound."
        required_skills:
          type: "array"
          items:
            $ref: "#/components/schemas/RequiredSkill"
          description: "What the ad asks for, in the order it stresses them. Include skills the CV does not have — this is the ad's side of the comparison, and the gaps are the useful part."
        job_ad:
          type: "string"
          description: "The ad itself, kept verbatim. Postings are taken down; without the original text there is no way to tell later what was applied for. Paste the text as given — do not summarise it."
        notes:
          type: "string"
          description: "Anything worth remembering that is not a field: a referral, a salary figure mentioned in passing, which parts of the CV were stretched thinnest to fit."
        applied_at:
          type: "string"
          format: "date"
          description: "The day the application was sent, as YYYY-MM-DD. Defaults to today when omitted."
    RequiredSkill:
      type: "object"
      description: "One thing the ad asks for, and how long for, when it says."
      required:
        - "name"
      properties:
        name:
          type: "string"
          maxLength: 255
          description: "The skill, as the ad names it."
        years:
          type: "integer"
          minimum: 0
          maximum: 50
          description: "Years asked for in this particular skill. Null when the ad does not say — which is most of the time."
    WorkExperience:
      type: "object"
      description: "One job. Everything but the bullets is a matter of record: do not reword company, title, period or location."
      properties:
        company:
          type: "string"
          maxLength: 500
          description: "Employer name. A matter of record: copy it back unchanged."
        title:
          type: "string"
          maxLength: 500
          description: "Job title held there. A matter of record: copy it back unchanged."
        period:
          type: "string"
          maxLength: 500
          description: "When, as printed, e.g. \"2024 – Present\". A matter of record: copy it back unchanged."
        location:
          type: "string"
          maxLength: 500
          description: "Where the job was based. A matter of record: copy it back unchanged."
        bullets:
          type: "array"
          items:
            type: "string"
            maxLength: 500
          description: "What was done there, one responsibility or result per line. Rewritable: lead with the work the job ad asks for, keep each line to one idea, and prefer a concrete outcome over a duty. Three to five lines for a recent role, fewer further back."
    Project:
      type: "object"
      description: "One project, printed as a title and the stack it was built with."
      properties:
        title:
          type: "string"
          maxLength: 500
          description: "Project name. A matter of record: copy it back unchanged."
        stack:
          type: "array"
          items:
            type: "string"
            maxLength: 500
          description: "Technologies it was built with. Reorder to put what the job ad asks for first; never add one that was not used."
    Education:
      type: "object"
      description: "One qualification. Entirely a matter of record."
      properties:
        school:
          type: "string"
          maxLength: 500
          description: "Institution name. A matter of record: copy it back unchanged."
        degree:
          type: "string"
          maxLength: 500
          description: "Qualification earned. A matter of record: copy it back unchanged."
        start_year:
          type: "string"
          maxLength: 500
          description: "Year started, e.g. \"2020\". A matter of record: copy it back unchanged."
        graduation_year:
          type: "string"
          maxLength: 500
          description: "Year finished, e.g. \"2023\". A matter of record: copy it back unchanged."
        location:
          type: "string"
          maxLength: 500
          description: "Where it was studied. A matter of record: copy it back unchanged."
    Language:
      type: "object"
      readOnly: true
      properties:
        name:
          type: "string"
          maxLength: 500
        level:
          type: "string"
          enum:
            - "Native"
            - "C2"
            - "C1"
            - "B2"
            - "B1"
            - "A2"
            - "A1"
